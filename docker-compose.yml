version: '3.8'

services:
  sundry-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sundry_homepage
    ports:
      - "7777:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
